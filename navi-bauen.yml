name: Navi bauen
on:
  push:
  workflow_dispatch:
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install cryptography
      - name: Tests
        run: sh tests/laufen.sh
      - name: Schlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.FV_NAVI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > build/fv-navi-schluessel.p12; echo "Eigener Schlüssel wird benutzt."
          else echo "::warning::Kein Schlüssel hinterlegt – es wird ein Wegwerf-Schlüssel erzeugt. Diese APK lässt sich später nicht als Update installieren."; fi
      - name: APK bauen und prüfen
        env:
          PW: ${{ secrets.FV_NAVI_KEYSTORE_PASSWORT }}
        run: |
          PW="${PW:-wegwerf-$(date +%s)}"
          python3 werkzeuge/bauen.py basis/Navi.3_4-original.apk www build/fv-navi-schluessel.p12 "$PW" build/Fehnverleih-Navi.apk
          python3 werkzeuge/pruefen.py build/Fehnverleih-Navi.apk basis/Navi.3_4-original.apk www
      - uses: actions/upload-artifact@v4
        with:
          name: Fehnverleih-Navi-APK
          path: build/Fehnverleih-Navi.apk
